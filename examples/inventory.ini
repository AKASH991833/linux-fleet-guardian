# Example inventory. Copy, edit, then: fleetguard scan -i examples/inventory.ini
[defaults]
user = ops
sudo = true          # run probes with `sudo -n` so root-only files (/etc/shadow) can be read

[web1]
address = 10.0.0.11

[db1]
address = 10.0.0.21
port = 2222
key = ~/.ssh/fleet_ed25519

[this-machine]
local = true
sudo = false

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetguard"
version = "0.1.0"
description = "Audit, drift detection, reversible fixes, backup restore-tests, DR drills and incident timelines for Linux fleets"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
fleetguard = "fleetguard.cli:main"

[tool.setuptools]
packages = ["fleetguard"]
